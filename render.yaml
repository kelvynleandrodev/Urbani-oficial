databases:
  - name: urbani-db
    plan: free
    region: virginia
    databaseName: urbani
    user: urbani
    postgresMajorVersion: "16"

services:
  - type: web
    name: urbani
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.migrar && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: urbani-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRA_MIN
        value: "480"
